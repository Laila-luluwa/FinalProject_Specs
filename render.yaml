# Optional Render Blueprint — NOT required if leanstock-api + Postgres already exist.
# New project only: Render Dashboard → New → Blueprint → this repo.
# Redis: create at https://console.upstash.com and set REDIS_URL manually (or in dashboard).
# After deploy: Shell → node seed.js

services:
  - type: web
    name: leanstock-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node app.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leanstock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set in Render Dashboard after first deploy (secrets):
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: leanstock-db
    plan: free
    databaseName: leanstock
    user: leanstock
