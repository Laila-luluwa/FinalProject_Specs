services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leanstock
    # Host 5433 avoids conflict if local PostgreSQL uses 5432
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host 6380 avoids conflict if Redis already runs on Windows (port 6379)
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    # Host 3001 if local npm/another app uses 3000
    ports:
      - '3001:3000'
    environment:
      DOCKER_COMPOSE: "1"
      SKIP_REDIS_QUEUES: "1"
      # Hardcoded for Compose — host .env must not override these.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leanstock
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-local-docker-dev-secret-min-32-characters}
      CORS_ORIGINS: http://localhost:8888,http://127.0.0.1:8888,http://localhost:3001,http://127.0.0.1:3001,http://localhost,http://127.0.0.1
      APP_URL: http://localhost:8888
      CLIENT_URL: http://localhost:8888
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: "${EMAIL_FROM:-LeanStock <no-reply@leanstock.local>}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:3000}
    # Host 8888 — 8080/80 often busy on Windows (IIS, other apps)
    ports:
      - '8888:80'
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
